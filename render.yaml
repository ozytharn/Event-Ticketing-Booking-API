services:
  - type: web
    name: event-ticketing-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: event-ticketing-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ORGANIZER_REGISTRATION_CODE
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

databases:
  - name: event-ticketing-db
    plan: free
    databaseName: event_ticketing
    user: event_ticketing
